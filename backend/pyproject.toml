[project]
name = "triage-backend"
version = "0.1.0"
description = "Backend for AI triage testing platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.1",
    "bcrypt>=4.2.0",
    "httpx>=0.28.1",
    "python-ulid>=4.0.1",
    "tzdata>=2026.5",
]

# uv ставит группу dev по умолчанию при `uv sync`
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008 — Depends() в аргументах по умолчанию это идиома FastAPI.
# RUF001-003 — ложные срабатывания на кириллицу в строках/комментариях.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Демо-протоколы DICOM SR — данные: строки «Поле- значение» не переносим
"app/seed/data.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
